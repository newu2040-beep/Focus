name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_MAJOR_VERSION"
          
          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "ERROR: Unable to detect active Java major version." >&2
            exit 1
          fi
          
          if ! [ "$JAVA_MAJOR_VERSION" -ge 17 ] 2>/dev/null; then
            echo "ERROR: Java major version is $JAVA_MAJOR_VERSION. Java 17 or newer is required." >&2
            exit 1
          fi
          
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug keystore already exists at ./debug.keystore"
          else
            echo "Generating temporary debug keystore at ./debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore" >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk for discovered APK paths:" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" >&2
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK file $EXPECTED_APK is empty." >&2
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: File $EXPECTED_APK does not have .apk extension." >&2
              exit 1
              ;;
          esac
          
          echo "Confirmed: $EXPECTED_APK exists, is a regular non-empty file with .apk extension."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"
          
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/^-*//;s/-*$//')
          if [ -z "$SANITIZED_REPO_NAME" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi
          
          RELEASE_ASSET_NAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_PATH="${TEMP_RELEASE_DIR}/${RELEASE_ASSET_NAME}"
          
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_ASSET_PATH"
          
          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $RELEASE_ASSET_PATH" >&2
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          
          echo "asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $RELEASE_ASSET_PATH"
          echo "Target release tag: $RELEASE_TAG"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.prepare_asset.outputs.release_tag }}
        run: |
          echo "Verifying GitHub CLI availability..."
          gh --version
          
          if [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset not found at $ASSET_PATH" >&2
            exit 1
          fi
          
          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset is empty: $ASSET_PATH" >&2
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset does not have .apk extension: $ASSET_PATH" >&2
              exit 1
              ;;
          esac
          
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug Build
          - **Build Type:** Automatically generated debug APK
          - **Built By:** GitHub Actions
          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Usage:** Intended for testing and verification
          - **Notice:** This APK is not a Play Store production release
          - **Signing:** Signed only with a temporary debug keystore
          EOF
          )
          
          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare_asset.outputs.release_tag }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Confirmed ==="
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)
            TAG_NAME=$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)
            TITLE=$(gh release view "$RELEASE_TAG" --json name --jq .name)
            
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Succeeded!
          - **Release Tag:** \`$TAG_NAME\`
          - **Release Title:** $TITLE
          - **Release URL:** [$RELEASE_URL]($RELEASE_URL)
          - **APK Asset:** \`$ASSET_NAME\`
          
          ### 📱 How to Download on your Phone
          1. Open the [GitHub Release Page]($RELEASE_URL).
          2. Under the **Assets** section, tap on \`$ASSET_NAME\` to download and install the debug APK directly.
          3. *Backup:* The standard GitHub Actions artifact **\`app-debug-apk\`** is also available in the summary section below.
          EOF
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "The debug APK was successfully built and preserved as an Actions artifact."
            echo "Artifact name: app-debug-apk"
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Build Summary
          - **Build Status:** Succeeded
          - **Artifact Upload:** Succeeded (\`app-debug-apk\`)
          - **GitHub Release Status:** Publishing to GitHub Releases did not complete.
          
          ### 📱 How to Download the Artifact
          You can download the debug APK from the **Artifacts** section at the bottom of this workflow run page.
          EOF
          fi
